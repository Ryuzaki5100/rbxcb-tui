name: publish-apt-repo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
      publish:
        description: "Publish the signed apt repository"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ inputs.publish && vars.ENABLE_APT_REPO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify signing secrets
        run: test -n "$GPG_PRIVATE_KEY" && test -n "$GPG_PASSPHRASE"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Build and publish apt repo
        run: ./packaging/apt/publish.sh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
